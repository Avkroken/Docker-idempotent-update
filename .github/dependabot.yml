version: 2
updates:
  - package-ecosystem: "github-actions"
    assignees: ["blixten85"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "01:00"
      timezone: "Europe/Stockholm"
    groups:
      actions-patch-minor:
        update-types: ["minor", "patch"]

  # requirements.txt finns i plex-clear-watchlist/. Roten har inga
  # pip-beroenden — src/ kör på standardbiblioteket.
  - package-ecosystem: "pip"
    assignees: ["blixten85"]
    directories:
      - "/plex-clear-watchlist"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "01:10"
      timezone: "Europe/Stockholm"
    groups:
      pip-patch-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    assignees: ["blixten85"]
    directory: "/plex-clear-watchlist"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "01:20"
      timezone: "Europe/Stockholm"
    groups:
      docker-patch-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker-compose"
    assignees: ["blixten85"]
    directory: "/plex-clear-watchlist"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "01:30"
      timezone: "Europe/Stockholm"
    groups:
      docker-compose-patch-minor:
        update-types: ["minor", "patch"]

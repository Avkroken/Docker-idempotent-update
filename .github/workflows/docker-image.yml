name: Docker Image CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Build the Docker image
      run: docker build plex-clear-watchlist --file plex-clear-watchlist/Dockerfile --tag plex-clear-watchlist:$(date +%s)

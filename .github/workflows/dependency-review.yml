# Based on GitHub's official Dependency Review starter workflow:
# https://github.com/actions/starter-workflows/blob/main/code-scanning/dependency-review.yml
name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0

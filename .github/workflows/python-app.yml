# This workflow is based on GitHub's official Python application starter workflow:
# https://github.com/actions/starter-workflows/blob/main/ci/python-app.yml
name: Python application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest PyYAML
          pip install -r plex-clear-watchlist/requirements.txt
      - name: Lint with flake8
        run: |
          # Stop the build for Python syntax errors or undefined names.
          flake8 src plex-clear-watchlist --count --select=E9,F63,F7,F82 --show-source --statistics
          # Report all remaining style findings without failing the build.
          flake8 src plex-clear-watchlist --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test repository configuration
        run: bash tests/test_pr_changes.sh

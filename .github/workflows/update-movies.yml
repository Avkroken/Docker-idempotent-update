name: Update Filtered Movies

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # PAT (GH_TOKEN), inte default GITHUB_TOKEN: pushes/PR:ar gjorda med
      # GITHUB_TOKEN triggar aldrig andra workflows (ci.yml:s required
      # repository-checks-jobb), så auto-merge fastnar i BLOCKED för evigt.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run movie filter script
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 filter_movies.py

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add filtered_movies_radarr.json || true
          if ! git diff --cached --quiet; then
            BRANCH="claude/update-movies-${GITHUB_RUN_ID}"
            git checkout -b "$BRANCH"
            git commit -m "Update filtered movies [skip ci]"
            git push origin "$BRANCH"
            PR_URL=$(gh pr create --title "Update filtered movies $(date +%Y-%m-%d)" \
              --body "Automated daily TMDB update." \
              --base main --head "$BRANCH")
            gh pr merge --auto --squash --delete-branch "$PR_URL"
          else
            echo "No changes to commit"
          fi

name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate Conventional Commit title
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys

          pattern = re.compile(
              r"^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)"
              r"(\([^)]+\))?!?: [^\s].*$"
          )

          valid = (
              "feat: preserve additional container settings",
              "fix(docker): restore container rollback",
              "perf!: replace image update contract",
              "docs: clarify backup model",
              "build(deps): update Docker action",
              "ci: harden image validation",
              "refactor(update): isolate recreation logic",
              "revert: restore previous scheduler behavior",
          )
          invalid = (
              "Add container settings",
              "feature: add container settings",
              "feat add container settings",
              "feat:",
              "Feat: add container settings",
          )

          for fixture in valid:
              if not pattern.fullmatch(fixture):
                  print(f"::error::validator rejected valid fixture: {fixture}")
                  sys.exit(1)

          for fixture in invalid:
              if pattern.fullmatch(fixture):
                  print(f"::error::validator accepted invalid fixture: {fixture}")
                  sys.exit(1)

          title = os.environ.get("PR_TITLE", "").strip()
          if pattern.fullmatch(title):
              print(f"PR title follows Conventional Commits: {title}")
              sys.exit(0)

          print("::error title=Invalid PR title::Use Conventional Commits, for example: "
                "feat: preserve container settings, fix(docker): restore rollback, "
                "or feat!: change the public update contract.")
          print(f"Received: {title!r}")
          sys.exit(1)
          PY

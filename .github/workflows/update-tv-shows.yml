name: Update Filtered TV Shows

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # PAT (GH_TOKEN), inte default GITHUB_TOKEN: pushes/PR:ar gjorda med
      # GITHUB_TOKEN triggar aldrig andra workflows (ci.yml:s required
      # repository-checks-jobb), så auto-merge fastnar i BLOCKED för evigt.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TV filter script
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: python3 filter_tv_shows.py

      # INTE "[skip ci]" i commit-meddelandet nedan: se update-movies.yml
      # för samma resonemang — en obligatorisk check som medvetet aldrig
      # körs blockerar merge permanent.
      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add filtered_tv_shows_sonarr.json || true
          if ! git diff --cached --quiet; then
            BRANCH="claude/update-tv-shows-${GITHUB_RUN_ID}"
            git checkout -b "$BRANCH"
            git commit -m "Update filtered TV shows"
            git push origin "$BRANCH"
            PR_URL=$(gh pr create --title "Update filtered TV shows $(date +%Y-%m-%d)" \
              --body "Automated daily TMDB update." \
              --base main --head "$BRANCH")
            gh pr merge --auto --squash --delete-branch "$PR_URL"
          else
            echo "No changes to commit"
          fi

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # Pinnad version: `uvx ruff` utan version hämtar senaste, så CI gick
      - name: ruff check
        run: uvx ruff@0.16.0 check src/
      - name: ruff format
        run: uvx ruff@0.16.0 format --check src/

  # Ett jobb för alla tre delarna. Inte en matris: den obligatoriska checken
  # heter python, och matrisjobb heter "python (filtered-movies)" — namnet
  # skulle försvinna och checken fastna på "Expected — waiting for status".
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          find . -path './.git' -prune -o -name 'requirements.txt' -print0 \
            | xargs -0 -r -n1 python -m pip install -r

      - name: Kompilera
        run: python -m compileall .

      - name: Kör tester
        run: |
          python -m pip install pytest
          for d in . filtered-movies plex-clear-watchlist; do
            if [ -d "$d/tests" ]; then
              echo "--- $d"
              (cd "$d" && python -m pytest)
            fi
          done

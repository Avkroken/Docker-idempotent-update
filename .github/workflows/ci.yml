name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required:
    name: CI / required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: plex-clear-watchlist/requirements.txt
      - name: Install dependencies
        run: |
          # Keep lint/format behavior deterministic; update this pin deliberately
          # after the new Ruff release has been verified against both Python trees.
          python -m pip install ruff==0.16.0 PyYAML
          python -m pip install -r plex-clear-watchlist/requirements.txt
      - name: Lint
        run: |
          ruff check src/ plex-clear-watchlist/
          ruff format --check src/ plex-clear-watchlist/
      - name: Verify Python sources
        run: python -m compileall -q src plex-clear-watchlist
      - name: Run repository test harness
        run: bash tests/test_pr_changes.sh

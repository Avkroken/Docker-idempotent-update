name: Python lint & tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Ruff
        run: |
          python -m pip install ruff==0.16.0
          ruff check src/
          ruff format --check src/

  # Rulesetet kräver statuskontexten exakt "python". Behåll jobbnamnet.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Installera beroenden
        run: |
          find . -path './.git' -prune -o -name 'requirements.txt' -print0 \
            | xargs -0 -r -n1 python -m pip install -r

      - name: Kompilera
        run: python -m compileall .

      - name: Kör tester
        run: |
          python -m pip install pytest
          for d in . plex-clear-watchlist; do
            if [ -n "$(find "$d/tests" -maxdepth 1 -name 'test_*.py' 2>/dev/null)" ]; then
              echo "--- $d"
              (cd "$d" && python -m pytest)
            else
              echo "--- $d: inga pytest-tester"
            fi
          done

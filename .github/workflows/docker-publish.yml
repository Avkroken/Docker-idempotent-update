# Based on GitHub's official Docker publishing starter workflow:
# https://github.com/actions/starter-workflows/blob/main/ci/docker-publish.yml
name: Docker

on:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      target_sha:
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_call' && inputs.target_sha || '' }}

      - name: Validate release image tag
        if: ${{ github.event_name == 'workflow_call' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || {
            echo "::error::Invalid release image tag: ${RELEASE_TAG}"
            exit 1
          }
      - name: Resolve image namespace from repository owner
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          [[ "${owner}" =~ ^[a-z0-9][a-z0-9-]*$ ]] || {
            echo "::error::Invalid container registry owner"
            exit 1
          }
          echo "IMAGE_NAME=${owner}/plex-clear-watchlist" >> "${GITHUB_ENV}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.release_tag }},enable=${{ github.event_name == 'workflow_call' }}
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=ref,event=tag,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
            type=schedule,pattern=nightly
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: plex-clear-watchlist
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: ${{ github.event_name != 'schedule' && 'type=gha' || '' }}
          cache-to: type=gha,mode=max

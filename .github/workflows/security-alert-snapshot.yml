name: Skapa Issues för säkerhetsalerts

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  issues: write

concurrency:
  group: security-alert-issues
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skapa Issues för öppna security alerts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api_list() {
            local endpoint="$1" output="$2" pages="${2}.pages"
            if gh api --paginate --slurp -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$endpoint" > "$pages" 2>/dev/null; then
              jq 'add // []' "$pages" > "$output"
            else
              printf '[]\n' > "$output"
              echo "Kunde inte läsa $endpoint; hoppar över den alerttypen." >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          api_list "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" /tmp/code-scanning.json
          api_list "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" /tmp/dependabot.json
          gh issue list --state all --limit 1000 --json number,body > /tmp/issues.json
          find_issue() { jq -r --arg marker "$1" '.[] | select((.body // "") | contains($marker)) | .number' /tmp/issues.json | head -n1; }
          created=0; skipped=0
          while IFS= read -r alert; do
            number="$(jq -r '.number' <<<"$alert")"; marker="<!-- security-alert:code-scanning:${number} -->"
            if [[ -n "$(find_issue "$marker")" ]]; then skipped=$((skipped + 1)); continue; fi
            rule="$(jq -r '.rule.name // .rule.id // "Code scanning alert"' <<<"$alert")"
            rule_id="$(jq -r '.rule.id // "unknown"' <<<"$alert")"
            severity="$(jq -r '(.rule.security_severity_level // .rule.severity // "unknown") | ascii_upcase' <<<"$alert")"
            tool="$(jq -r '.tool.name // "unknown"' <<<"$alert")"
            file="$(jq -r '.most_recent_instance.location.path // "unknown"' <<<"$alert")"
            line="$(jq -r '.most_recent_instance.location.start_line // "unknown"' <<<"$alert")"
            url="$(jq -r '.html_url' <<<"$alert")"
            gh issue create --title "[Security][Code scanning][${severity}] ${rule}" --body "${marker}
Automatiskt skapat från ett öppet GitHub Code Scanning-alert.

- **Severity:** ${severity}
- **Rule:** ${rule} (${rule_id})
- **Tool:** ${tool}
- **Location:** \`${file}:${line}\`
- **Alert:** ${url}

Stäng detta Issue när alerten är åtgärdad eller avsiktligt avfärdad i GitHub Security." >/dev/null
            created=$((created + 1))
          done < <(jq -c '.[]' /tmp/code-scanning.json)
          while IFS= read -r alert; do
            number="$(jq -r '.number' <<<"$alert")"; marker="<!-- security-alert:dependabot:${number} -->"
            if [[ -n "$(find_issue "$marker")" ]]; then skipped=$((skipped + 1)); continue; fi
            package="$(jq -r '.dependency.package.name // "unknown package"' <<<"$alert")"
            ecosystem="$(jq -r '.dependency.package.ecosystem // "unknown"' <<<"$alert")"
            manifest="$(jq -r '.dependency.manifest_path // "unknown"' <<<"$alert")"
            severity="$(jq -r '(.security_advisory.severity // "unknown") | ascii_upcase' <<<"$alert")"
            summary="$(jq -r '.security_advisory.summary // "Dependabot vulnerability or malware alert"' <<<"$alert")"
            ghsa="$(jq -r '.security_advisory.ghsa_id // "n/a"' <<<"$alert")"
            url="$(jq -r '.html_url' <<<"$alert")"
            gh issue create --title "[Security][Dependabot][${severity}] ${package}: ${summary}" --body "${marker}
Automatiskt skapat från ett öppet GitHub Dependabot-alert, inklusive vulnerability- och malware-alerts.

- **Severity:** ${severity}
- **Package:** ${package} (${ecosystem})
- **Manifest:** \`${manifest}\`
- **Advisory:** ${ghsa}
- **Summary:** ${summary}
- **Alert:** ${url}

Stäng detta Issue när alerten är åtgärdad eller avsiktligt avfärdad i GitHub Security." >/dev/null
            created=$((created + 1))
          done < <(jq -c '.[]' /tmp/dependabot.json)
          echo "Skapade Issues: ${created}" >> "$GITHUB_STEP_SUMMARY"
          echo "Redan representerade alerts: ${skipped}" >> "$GITHUB_STEP_SUMMARY"
          echo "Öppna Code Scanning-alerts: $(jq 'length' /tmp/code-scanning.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "Öppna Dependabot-alerts: $(jq 'length' /tmp/dependabot.json)" >> "$GITHUB_STEP_SUMMARY"

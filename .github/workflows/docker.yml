name: Docker build & Trivy

# Startar Docker-jobbet direkt på PR och avgör påverkan på samma runner innan
# det dyra bygget. Då slipper vi ett separat impact-jobb som måste avslutas och
# en ny runner köas innan Docker-builden ens kan börja.
# På PR:er där Docker inte påverkas laddas ett tomt Trivy-SARIF upp så GitHubs
# Code Scanning merge protection ändå får en analys för aktuell PR-head.
# En schemalagd körning bygger imagen på nytt för att hitta nya CVE:er även när
# repositoryt inte har ändrats.

on:
  # Merge-kön skickar merge_group.checks_requested. Utan den här
  # triggern svarar inget jobb och kön fastnar tills timeout.
  merge_group:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # måndagar 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy-resultat till code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bestäm Docker-påverkan
        id: impact
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run=true
          if [[ "${{ github.event_name }}" != "workflow_dispatch" && "${{ github.event_name }}" != "schedule" && -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            run=false
            while IFS= read -r file; do
              case "$file" in
                plex-clear-watchlist/*|.github/actions/trivy/*|.github/workflows/docker.yml)
                  run=true
                  break
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=ACMRDTUXB "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "docker=$run" >> "$GITHUB_OUTPUT"
          echo "Docker impact: $run"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: steps.impact.outputs.docker == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        if: steps.impact.outputs.docker == 'true'
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        if: steps.impact.outputs.docker == 'true'
        with:
          context: plex-clear-watchlist
          push: false
          load: true
          tags: |
            ghcr.io/blixten85/plex-clear-watchlist:latest
            ghcr.io/blixten85/plex-clear-watchlist:sha-${{ steps.sha.outputs.short }}

      - name: Trivy
        if: steps.impact.outputs.docker == 'true'
        uses: ./.github/actions/trivy
        with:
          image-ref: ghcr.io/blixten85/plex-clear-watchlist:sha-${{ steps.sha.outputs.short }}
          category: trivy-plex-clear-watchlist

      - name: Skapa tomt Trivy-resultat för opåverkad Docker
        if: github.event_name == 'pull_request' && steps.impact.outputs.docker != 'true'
        run: |
          cat > trivy-empty.sarif <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [{"tool":{"driver":{"name":"Trivy","rules":[]}},"results":[]}]
          }
          EOF

      - name: Ladda upp tomt Trivy-resultat
        if: github.event_name == 'pull_request' && steps.impact.outputs.docker != 'true'
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          sarif_file: trivy-empty.sarif
          category: trivy-plex-clear-watchlist

      - name: Publicera imagen
        if: steps.impact.outputs.docker == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        run: |
          docker push ghcr.io/blixten85/plex-clear-watchlist:latest
          docker push ghcr.io/blixten85/plex-clear-watchlist:sha-${{ steps.sha.outputs.short }}

      - name: Hoppa över opåverkad Docker-build
        if: steps.impact.outputs.docker != 'true'
        run: echo "Docker-contexten påverkas inte; inget imagebygge behövs."

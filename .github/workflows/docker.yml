name: Docker build & Trivy

# Bygger plex-clear-watchlist-imagen, publicerar den och skannar den med
# Trivy. Workflowet startar alltid på PR så ett eventuellt required checknamn
# kan rapporteras, men det dyra Docker-jobbet körs bara när image-contexten,
# Trivy-actionen eller workflowet självt faktiskt påverkas.
# En schemalagd körning bygger imagen på nytt för att hitta nya CVE:er även när
# repositoryt inte har ändrats.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # måndagar 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.impact.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bestäm Docker-påverkan
        id: impact
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run=true
          if [[ "${{ github.event_name }}" != "workflow_dispatch" && "${{ github.event_name }}" != "schedule" && -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            run=false
            while IFS= read -r file; do
              case "$file" in
                plex-clear-watchlist/*|.github/actions/trivy/*|.github/workflows/docker.yml)
                  run=true
                  break
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=ACMRDTUXB "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "docker=$run" >> "$GITHUB_OUTPUT"
          echo "Docker impact: $run"

  docker:
    needs: impact
    if: ${{ needs.impact.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy-resultat till code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: plex-clear-watchlist
          push: false
          load: true
          tags: |
            ghcr.io/blixten85/plex-clear-watchlist:latest
            ghcr.io/blixten85/plex-clear-watchlist:sha-${{ steps.sha.outputs.short }}

      - name: Trivy
        uses: ./.github/actions/trivy
        with:
          image-ref: ghcr.io/blixten85/plex-clear-watchlist:sha-${{ steps.sha.outputs.short }}
          category: trivy-plex-clear-watchlist

      - name: Publicera imagen
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          docker push ghcr.io/blixten85/plex-clear-watchlist:latest
          docker push ghcr.io/blixten85/plex-clear-watchlist:sha-${{ steps.sha.outputs.short }}

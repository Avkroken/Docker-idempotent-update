name: Docker

# Bygger plex-clear-watchlist-imagen, publicerar den och skannar den med
# Trivy. Skanningen rapporterar till code scanning men fäller inte bygget —
# se .github/actions/trivy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy-resultat till code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: plex-clear-watchlist
          push: false
          load: true
          tags: |
            ghcr.io/blixten85/plex-clear-watchlist:latest
            ghcr.io/blixten85/plex-clear-watchlist:sha-${{ steps.sha.outputs.short }}

      # Skanningen bor i .github/actions/trivy, en fil per verktyg. Imagen
      # byggs lokalt (load: true) så den finns att skanna även på PR:er, där
      # inget publiceras.
      - name: Trivy
        uses: ./.github/actions/trivy
        with:
          image-ref: ghcr.io/blixten85/plex-clear-watchlist:sha-${{ steps.sha.outputs.short }}
          category: trivy-plex-clear-watchlist

      - name: Publicera imagen
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          docker push ghcr.io/blixten85/plex-clear-watchlist:latest
          docker push ghcr.io/blixten85/plex-clear-watchlist:sha-${{ steps.sha.outputs.short }}

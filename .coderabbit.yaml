# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true
reviews:
  path_instructions:
  - path: src/docker_update.py
    instructions: |
      Review Docker mutations as a safety-critical path.
      DRY_RUN=true must remain non-mutating.
      Socket-mode recreation must preserve inspect-derived runtime configuration
      and retain best-effort rollback if replacement startup fails.
      Flag changes that broaden Docker socket, host, or credential privileges.
  - path: src/backup.py
    instructions: |
      Review backup changes for dry-run safety, explicit source/destination behavior,
      error propagation, and avoidance of destructive side effects.
  - path: plex-clear-watchlist/**
    instructions: |
      Review Plex API changes for pagination, authentication handling, idempotency,
      bounded external calls, and clear failure behavior.
code_generation:
  docstrings:
    path_instructions:
    - path: src/**/*.py
      instructions: |-
        Följ organisationens generella Google-style-standard för Python-docstrings och komplettera den med repositoryts Docker-, backup- och runtimekontrakt.

        För icke-triviala funktioner och klasser ska dokumentationen när relevant beskriva:

        * om operationen endast läser state eller kan mutera Docker-runtime, images, containers, volumes, filer eller backupdestinationer;
        * DRY_RUN-semantik och vilka operationer som uttryckligen måste förbli icke-muterande i dry-run-läge;
        * skillnaden mellan Docker Compose-vägen och direkt Docker CLI/socket-baserad containerhantering;
        * vilka egenskaper från docker inspect som måste bevaras vid recreation, exempelvis restart policy, network mode, user/workdir, environment, mounts, ports, labels, capabilities, security options, devices, DNS, resource limits, log driver, stop signal, entrypoint och command när de är relevanta för funktionen;
        * lifecycle för container-recreation, inklusive rename/backup av originalcontainer, start av ersättare, verifiering och best-effort rollback vid fel;
        * när en funktion kan lämna runtime i ett partiellt förändrat tillstånd och vilket recovery-beteende som gäller;
        * subprocessanrop till Docker, Compose eller andra externa verktyg, inklusive viktiga exit-/failure-villkor;
        * backup source, destination och filsystems-/nätverkssidoeffekter när funktionen deltar i backupflödet;
        * scheduler-, status- eller rapporteringssidoeffekter när dessa ingår i kontraktet;
        * idempotens och vad en säker återkörning innebär.

        Dokumentera säkerhetskritiska gränser tydligt. Docker-socket, host access, capabilities, mounts och credentials ska behandlas som privilegierade resurser; docstrings får inte normalisera eller rekommendera bredare behörigheter som bekvämlighetslösning.

        Beskriv observerbart kontrakt och driftinvarianter, inte Docker-kommandon rad för rad. Intern implementation får kunna refaktoreras utan att dokumentationen blir fel så länge runtimebeteendet är oförändrat.

        Dokumentera aldrig secrets, registrycredentials, tokens eller andra credentialvärden.
    - path: plex-clear-watchlist/**/*.py
      instructions: |-
        Följ organisationens generella Google-style-standard för Python-docstrings och komplettera den med repositoryts Plex-specifika API- och mutationskontrakt.

        För icke-triviala funktioner och klasser ska dokumentationen när relevant beskriva:

        * vilket Plex API-anrop eller vilken resurs funktionen arbetar mot;
        * om operationen är read-only eller kan mutera användarens Plex-state;
        * autentiseringskrav och credentialgräns utan att exponera tokenvärden;
        * pagination och hur samtliga relevanta resultat traverseras;
        * bounded API-anrop, batchning eller andra begränsningar som påverkar täckningen;
        * identifierare och matchningsregler som används för att avgöra vilken watchlist-post eller resurs som påverkas;
        * idempotens och vad en säker återkörning innebär;
        * delete-/remove-semantik och när en operation faktiskt orsakar en extern mutation;
        * nätverksfel, HTTP-fel, partiella svar och andra failure modes som anroparen måste kunna hantera;
        * timeout-, retry- eller backoff-beteende om sådant ingår i kontraktet;
        * hur ett partiellt misslyckande rapporteras och om redan utförda mutationer kan lämnas kvar;
        * vilka antaganden som görs om Plex-server, konto eller API-format och vilka som måste verifieras från faktisk respons.

        För funktioner som tar bort poster ska det framgå vad som identifierar rätt mål och vilka villkor som måste vara uppfyllda innan mutation sker. Dokumentationen ska inte ge intryck av att en operation är riskfri enbart för att den normalt är idempotent.

        Skilj tydligt mellan lokal bearbetning och externa Plex-sidoeffekter. Beskriv observerbart kontrakt och felbeteende snarare än HTTP-anrop rad för rad.

        Dokumentera aldrig Plex-token, sessionsvärden, lösenord eller andra autentiseringsuppgifter. Exempel ska använda syntetiska identifierare och värden.
    - path: tests/**/*.py
      instructions: |
        Keep docstrings concise.
        Describe the behavioral contract being verified and the safety regression
        the test protects against; do not restate assertions line by line.

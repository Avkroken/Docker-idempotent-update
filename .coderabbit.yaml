# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true

reviews:
  # Legacy commit-status can report success when a review is rate limited.
  # Keep CodeRabbit on its canonical review-progress surface instead.
  review_progress: true
  fail_commit_status: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
